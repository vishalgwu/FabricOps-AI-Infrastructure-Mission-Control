[project]
name = "fabricops-backend"
version = "0.1.0"
description = "FabricOps backend: evidence-grounded infrastructure investigation (synthetic data only)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic-settings>=2.4,<3",
]

[project.optional-dependencies]
# Only needed to call the real Claude API. Tests and CI use the mock provider and need no key.
llm = [
    "anthropic>=1,<2",
]
openai = [
    "openai>=3,<4",
]
dev = [
    "pytest>=9.0.3,<10",
    "httpx>=0.27,<1",
    "anthropic>=1,<2",  # tests exercise the adapters with fake clients; no API key is needed
    "openai>=3,<4",
]

[tool.setuptools.packages.find]
include = ["app*", "evals*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
